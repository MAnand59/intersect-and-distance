name: Bug report
description: Report reproducible incorrect behavior.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include sensitive coordinates or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.19.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized inputs and runnable code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed private data.
          required: true
